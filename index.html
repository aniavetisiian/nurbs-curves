<div class="container">

    <button onclick="showText()">Find intersection point</button>
    <div id="hiddenText" style="display: none;"></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>

<script>
  function showText() {
    let hiddenText = document.getElementById('hiddenText');
    const cPnt = window._dd();
    hiddenText.textContent = `Closest point: x:${cPnt.x} y:${cPnt.y}`;
    hiddenText.style.display = 'block';
  }
</script>
